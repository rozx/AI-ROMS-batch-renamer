name: Create Release

on:
  pull_request:
    types: [closed]
    branches: ["release"]

jobs:
  create-draft-release:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && (contains(github.event.pull_request.labels.*.name, 'major') || contains(github.event.pull_request.labels.*.name, 'minor') || contains(github.event.pull_request.labels.*.name, 'patch'))
    permissions:
      # write permission is required to create a github release
      contents: write
      # write permission is required for autolabeler
      # otherwise, read permission is required at least
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Create GitHub Release
        id: create_release
        # Drafts your next Release notes as Pull Requests are merged into "master"
        uses: release-drafter/release-drafter@v6
        # (Optional) specify config name to use, relative to .github/. Default: release-drafter.yml
        # with:
        #   config-name: my-config.yml
        #   disable-autolabeler: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Persist the release tag name (e.g. v2.1.0) as an artifact for downstream jobs
      - name: Make release tag name
        run: echo '${{ steps.create_release.outputs.tag_name }}' > releaseTagName.txt

      # Upload the release upload URL as an artifact
      - name: Make release upload url
        run: echo '${{ steps.create_release.outputs.upload_url }}' > releaseUploadUrl.txt
      - name: Upload release upload url
        uses: actions/upload-artifact@v4
        with:
          name: releaseUploadUrl
          path: releaseUploadUrl.txt

      # Upload the release tag name as an artifact
      - name: Upload release tag name
        uses: actions/upload-artifact@v4
        with:
          name: releaseTagName
          path: releaseTagName.txt

  # Builds on Linux and creates a release
  builds-on-linux-and-release:
    runs-on: ubuntu-latest
    needs: create-draft-release
    permissions:
      # write permission is required to create a github release
      contents: write
      # write permission is required for autolabeler
      # otherwise, read permission is required at least
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Python
        uses: actions/setup-python@v5.6.0
        with:
          # Version range or exact version of Python or PyPy to use, using SemVer's version range syntax. Reads from .python-version if unset.
          python-version: 3.11

      - name: Setup Poetry
        # You may pin to the exact commit or the version.
        # uses: Gr1N/setup-poetry@48b0f77c8c1b1b19cb962f0f00dff7b4be8f81ec
        uses: Gr1N/setup-poetry@v9

      - name: Install dependencies
        run: |
          poetry install --no-interaction --no-ansi

      # Download the release tag name and release upload URL artifacts
      - name: download release upload url
        uses: actions/download-artifact@v4
        with:
          name: releaseUploadUrl

      - name: download release tag name
        uses: actions/download-artifact@v4
        with:
          name: releaseTagName

      # Save the release upload URL and tag name to environment variables and sync Poetry version; expose as step outputs
      - name: Set release metadata (Linux)
        id: set_release_metadata
        run: |
          RELEASE_UPLOAD_URL=$(cat releaseUploadUrl.txt)
          echo "RELEASE_UPLOAD_URL=$RELEASE_UPLOAD_URL" >> $GITHUB_ENV
          echo "Upload URL: $RELEASE_UPLOAD_URL"
          TAG_NAME=$(cat releaseTagName.txt)
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          APP_VERSION=${TAG_NAME#v}
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "Resolved App version from tag: $APP_VERSION"
          poetry version "$APP_VERSION"
          echo "Poetry version now: $(poetry version --short)"
          # Expose as outputs for later steps
          echo "release_upload_url=$RELEASE_UPLOAD_URL" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT

      # Sync const.py using bump2version (no commit) so runtime VERSION matches tag (Option B)
      - name: Sync const.py to version (Linux)
        run: |
          APP_VERSION="$APP_VERSION" poetry run bump
          echo "Const version now: $(grep VERSION ai_rom_batch_renamer/modules/const.py)"

      - name: Run build script
        run: |
          poetry run build --verbose

      # Upload the build
      - name: Archive the build
        uses: TheDoctor0/zip-release@0.7.6
        with:
          filename: release.zip
          type: zip
          path: ./dist/ai-rom-batch-renamer-Linux-X64
      - name: Upload Linux build
        uses: shogo82148/actions-upload-release-asset@v1
        with:
          overwrite: true
          upload_url: ${{ steps.set_release_metadata.outputs.release_upload_url }}
          asset_path: release.zip
          asset_name: RomBatchRenamer-Linux-X64-Modern-v${{ steps.set_release_metadata.outputs.app_version }}.zip

  # Builds on Windows and upload the build to the release
  builds-on-windows-and-release:
    runs-on: windows-latest
    needs: create-draft-release
    permissions:
      # write permission is required to create a github release
      contents: write
      # write permission is required for autolabeler
      # otherwise, read permission is required at least
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: 3.11

      - name: Setup Poetry
        uses: Gr1N/setup-poetry@v9

      - name: Install dependencies
        run: |
          poetry install --no-interaction --no-ansi

      # Download the release upload URL artifact
      - name: download release upload url
        uses: actions/download-artifact@v4
        with:
          name: releaseUploadUrl

      # Download the release tag name artifact
      - name: download release tag name
        uses: actions/download-artifact@v4
        with:
          name: releaseTagName

      # Save the release upload URL to an environment variable and sync Poetry version; expose as step outputs
      - name: Set release metadata (Windows)
        id: set_release_metadata
        run: |
          $RELEASE_UPLOAD_URL = Get-Content .\releaseUploadUrl.txt -Raw
          $RELEASE_UPLOAD_URL = $RELEASE_UPLOAD_URL.Trim()
          echo "RELEASE_UPLOAD_URL=$RELEASE_UPLOAD_URL" >> $env:GITHUB_ENV
          echo "Upload URL: $RELEASE_UPLOAD_URL"
          $TAG_NAME = Get-Content .\releaseTagName.txt -Raw
          $TAG_NAME = $TAG_NAME.Trim()
          echo "TAG_NAME=$TAG_NAME" >> $env:GITHUB_ENV
          $APP_VERSION = $TAG_NAME.TrimStart('v')
          echo "APP_VERSION=$APP_VERSION" >> $env:GITHUB_ENV
          echo "Resolved App version from tag: $APP_VERSION"
          poetry version $APP_VERSION
          $pv = poetry version --short
          echo "Poetry version now: $pv"
          # Expose as outputs
          echo "release_upload_url=$RELEASE_UPLOAD_URL" >> $env:GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $env:GITHUB_OUTPUT
          echo "app_version=$APP_VERSION" >> $env:GITHUB_OUTPUT
      # Sync const.py using bump2version (no commit) so runtime VERSION matches tag (Option B)
      - name: Sync const.py to version (Windows)
        shell: pwsh
        run: |
          $env:APP_VERSION=$env:APP_VERSION; poetry run bump
          Get-Content ai_rom_batch_renamer/modules/const.py | Select-String VERSION
      - name: Run build script
        run: |
          poetry run build --verbose

      # Archive the build and upload it to the release
      - name: Archive the build
        uses: TheDoctor0/zip-release@0.7.6
        with:
          filename: release.zip
          type: zip
          path: ./dist/ai-rom-batch-renamer-Windows-X64.exe

      - name: Upload Win build
        uses: shogo82148/actions-upload-release-asset@v1
        with:
          overwrite: true
          upload_url: ${{ steps.set_release_metadata.outputs.release_upload_url }}
          asset_path: release.zip
          asset_name: RomBatchRenamer-Win-X64-Modern-v${{ steps.set_release_metadata.outputs.app_version }}.zip

  # Builds on Mac and upload the build to the release
  builds-on-mac-and-release:
    runs-on: macOS-latest
    needs: create-draft-release
    permissions:
      # write permission is required to create a github release
      contents: write
      # write permission is required for autolabeler
      # otherwise, read permission is required at least
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: 3.11

      - name: Setup Poetry
        uses: Gr1N/setup-poetry@v9

      - name: Install dependencies
        run: |
          poetry install --no-interaction --no-ansi

      # Download the release upload URL artifact
      - name: download release upload url
        uses: actions/download-artifact@v4
        with:
          name: releaseUploadUrl

      # Download the release tag name artifact
      - name: download release tag name
        uses: actions/download-artifact@v4
        with:
          name: releaseTagName

      # Save the release upload URL and tag name to environment variables and sync Poetry version; expose as step outputs
      - name: Set release metadata (macOS)
        id: set_release_metadata
        run: |
          RELEASE_UPLOAD_URL=$(cat releaseUploadUrl.txt)
          echo "RELEASE_UPLOAD_URL=$RELEASE_UPLOAD_URL" >> $GITHUB_ENV
          echo "Upload URL: $RELEASE_UPLOAD_URL"
          TAG_NAME=$(cat releaseTagName.txt)
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          APP_VERSION=${TAG_NAME#v}
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "Resolved App version from tag: $APP_VERSION"
          poetry version "$APP_VERSION"
          echo "Poetry version now: $(poetry version --short)"
          # Expose as outputs for later steps
          echo "release_upload_url=$RELEASE_UPLOAD_URL" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT

      # Sync const.py using bump2version (no commit) so runtime VERSION matches tag (Option B)
      - name: Sync const.py to version (macOS)
        run: |
          APP_VERSION="$APP_VERSION" poetry run bump
          echo "Const version now: $(grep VERSION ai_rom_batch_renamer/modules/const.py)"

      - name: Run build script
        run: |
          poetry run build --verbose

      # Archive the build and upload it to the release
      - name: Archive the build
        uses: TheDoctor0/zip-release@0.7.6
        with:
          filename: release.zip
          type: zip
          path: ./dist/ai-rom-batch-renamer-MacOS-X64

      - name: Upload Mac build
        uses: shogo82148/actions-upload-release-asset@v1
        with:
          overwrite: true
          upload_url: ${{ steps.set_release_metadata.outputs.release_upload_url }}
          asset_path: release.zip
          asset_name: RomBatchRenamer-Mac-X64-Modern-v${{ steps.set_release_metadata.outputs.app_version }}.zip
